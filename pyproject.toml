[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dataset-preparation-toolkit"
version = "1.0.0"
description = "Local-first analysis and preparation of voice recordings for cloning and generation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wojciech Kraczewski" }]
keywords = ["audio", "voice", "dataset", "quality-control", "voice-cloning", "dsp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.scripts]
voiceprep = "voice_dataset_toolkit.cli:main"

[project.urls]
Homepage = "https://kraczewski.studio"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

